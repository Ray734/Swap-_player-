<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark light">
<title>Swap Player</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --bg:#0c0b10;--fg:#f5f3fa;--cd:#18161f;--cd2:#221f2b;--mu:#9a96a8;
  --a:#ff3b5c;--b:#c41e6a;--glow:color-mix(in srgb,var(--a) 35%,transparent);
  --radius:18px;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f3f1f7;--fg:#14121a;--cd:#fff;--cd2:#eceaf2;--mu:#6d6a7a;--glow:color-mix(in srgb,var(--a) 25%,transparent)
}}
:root[data-theme="light"]{--bg:#f3f1f7;--fg:#14121a;--cd:#fff;--cd2:#eceaf2;--mu:#6d6a7a;--glow:color-mix(in srgb,var(--a) 25%,transparent)}
:root[data-theme="dark"]{--bg:#0c0b10;--fg:#f5f3fa;--cd:#18161f;--cd2:#221f2b;--mu:#9a96a8}

html,body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;max-width:480px;margin:0 auto;min-height:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button,select,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-user-select:auto;user-select:auto}
main{padding:16px 16px 190px;touch-action:pan-y;-webkit-overflow-scrolling:touch}

/* headers */
h2{font-size:28px;font-weight:700;letter-spacing:-.4px;margin:8px 0 14px;display:flex;align-items:center;gap:8px}
.nw{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.nw button,#pc{padding:8px 14px;border-radius:99px;background:var(--cd);font-size:13px;font-weight:600}
.nw #pa,.nw #ppl{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}

/* search */
#q,#pn,select{width:100%;padding:12px 16px;border-radius:14px;border:0;background:var(--cd);margin-bottom:12px}

/* song rows */
.r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--cd);margin-bottom:8px;cursor:pointer;transition:transform .15s}
.r:active{transform:scale(.98)}
.r.sl{outline:2px solid var(--a)}
.ic{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#fff;font-size:18px;flex:none;box-shadow:0 4px 14px var(--glow)}
.tx{flex:1;min-width:0}.tx b,.tx small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx b{font-size:15px;font-weight:600}.tx small,.em{color:var(--mu);font-size:12px}
.h{font-size:20px;padding:6px 8px;opacity:.85}
.em{padding:24px 8px;text-align:center}

/* bottom nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;display:grid;grid-template-columns:repeat(6,1fr);align-items:center;padding:6px 4px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid #8882;z-index:20}
nav button{font-size:10px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;transition:color .15s,transform .12s}
nav button:active{transform:scale(.92)}
nav button i{font-style:normal;font-size:20px}
nav .on{color:var(--a)}
nav #add{width:52px;height:52px;border-radius:50%;margin:-28px auto 0;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:28px;font-weight:300;box-shadow:0 8px 28px var(--glow);display:grid;place-items:center;padding:0}

/* mini player */
#mini{display:none;position:fixed;left:10px;right:10px;bottom:calc(70px + var(--safe-b));max-width:460px;margin:auto;padding:10px 12px;align-items:center;gap:10px;background:var(--cd);border-radius:16px;box-shadow:0 8px 32px #0005;overflow:hidden;z-index:15;border:1px solid #8882}
#mini.on{display:flex;animation:slideUp .28s ease}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#mini .ic{width:42px;height:42px;border-radius:10px;font-size:16px}
#mb{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b));border-radius:0 2px 0 0}
#ms{position:absolute;left:0;right:0;bottom:0;width:100%;height:14px;opacity:0;margin:0;cursor:pointer}

/* now playing sheet */
#np{position:fixed;inset:0;z-index:30;max-width:480px;margin:auto;background:var(--bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.85,.2,1);overflow-y:auto;padding:calc(12px + var(--safe-t)) 20px calc(28px + var(--safe-b))}
#np.open{transform:none}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.top button{font-size:24px;color:var(--fg);padding:8px 12px}

/* art stage — inspired by bold red player */
.stage{aspect-ratio:1;border-radius:24px;margin:18px auto 20px;max-width:340px;background:
  radial-gradient(ellipse at 30% 20%, color-mix(in srgb,var(--a) 55%,transparent), transparent 55%),
  radial-gradient(ellipse at 70% 80%, color-mix(in srgb,var(--b) 45%,transparent), transparent 50%),
  linear-gradient(160deg,#1a0a12 0%,#2a0e18 40%,#120810 100%);
  position:relative;overflow:hidden;box-shadow:0 24px 60px var(--glow),0 0 0 1px #fff1}
.stage::before{content:"";position:absolute;inset:0;z-index:0;background:
  repeating-linear-gradient(-12deg,transparent 0 18px, #fff1 18px 19px),
  repeating-linear-gradient(12deg,transparent 0 22px, #0002 22px 23px);
  opacity:.35;pointer-events:none}
#art{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:2}
#art:not([style*="url"]){/* empty art keeps geometric pattern */}

#nt{font-size:22px;font-weight:700;text-align:center;margin:0 0 4px;letter-spacing:-.3px}
#na{text-align:center;color:var(--mu);font-size:14px;margin:0 0 10px}
#lyp{display:none;position:relative;height:min(40vh,320px);overflow-y:auto;scroll-behavior:smooth;background:var(--cd);border-radius:14px;padding:30% 14px;margin:0 0 6px;text-align:center;border:1px solid #8882}
#lyp.on{display:block}
#lyp p{font-size:18px;line-height:1.35;font-weight:600;margin:0 0 12px;opacity:.4;transition:.25s;white-space:pre-wrap}
#lyp.pl{padding:14px}#lyp.pl p{opacity:.9;font-size:15px;font-weight:400;margin:0 0 4px}
#lyp p.cur{opacity:1;color:var(--a);transform:scale(1.04)}
#lyh{display:none;justify-content:center;gap:6px;margin:0 0 14px;flex-wrap:wrap}#lyh.on{display:flex}
#lyh button{padding:6px 11px;border-radius:99px;background:var(--cd);font-size:12px}
.lyon .stage{max-width:130px;margin:10px auto}.stage{transition:max-width .25s}
.lr{display:flex;gap:10px;margin:12px 0}.lr i{flex:1;text-align:center;font-style:normal;padding:14px;border-radius:14px;background:var(--cd2);font-weight:700;transition:.15s}.lr i.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;transform:scale(1.05)}
#mini.on~#sb{bottom:calc(142px + var(--safe-b))}#mini.on~#toast{bottom:calc(150px + var(--safe-b))}
input[type=range]{width:100%;accent-color:var(--a);height:6px;touch-action:none}
.tm{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:6px;font-variant-numeric:tabular-nums}

.ct{display:flex;justify-content:space-between;align-items:center;margin:18px 8px 12px}
.ct button{font-size:24px;padding:14px;opacity:.9;min-width:48px;min-height:48px}
.ct .big{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:28px;opacity:1;padding:0;box-shadow:0 10px 30px var(--glow);display:grid;place-items:center}
.ct .dim{opacity:.3}

.ch{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;justify-content:center}
.ch button{padding:8px 14px;border-radius:99px;background:var(--cd);font-size:13px;font-weight:500}
.ch .on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}

/* cards / sound page */
.card{background:var(--cd);border-radius:20px;padding:16px;margin-bottom:12px}
.card label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);margin:8px 0}
.card label span{width:72px;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;background:#8884;position:relative;flex:none}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:linear-gradient(135deg,var(--a),var(--b))}.tg.on:after{left:25px}
.card input[type=range]{flex:1}

/* video layer */
#vw{position:fixed;left:0;top:0;z-index:31;background:#000;display:none;overflow:hidden}#vw.fl{width:200px;height:113px;border-radius:14px;box-shadow:0 8px 28px #0008;touch-action:none}
#v{width:100%;height:100%;max-height:100%;object-fit:contain;background:#000}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:2}

/* fav floating */
#fv{position:fixed;z-index:35;width:48px;height:48px;border-radius:50%;background:var(--cd);box-shadow:0 6px 20px #0005;font-size:22px;display:none;place-items:center;border:1px solid #8883}

/* selection bar */
#sb{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + var(--safe-b));width:calc(100% - 20px);max-width:460px;background:var(--cd);border-radius:16px;padding:10px;gap:6px;z-index:18;box-shadow:0 8px 28px #0004;flex-wrap:wrap;justify-content:center}
#sb.on{display:flex}
#sb button{padding:8px 12px;border-radius:99px;background:var(--cd2);font-size:12px;font-weight:600}

/* menu + toast */
#menu{display:none;position:fixed;inset:0;z-index:50;background:#0008;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
#menu.on{display:flex}
#menu>div{width:100%;max-width:480px;background:var(--cd);border-radius:20px 20px 0 0;padding:8px 0 calc(12px + var(--safe-b));max-height:70vh;overflow-y:auto}
#menu button{display:block;width:100%;text-align:left;padding:14px 20px;font-size:15px;border-bottom:1px solid #8882}
#menu button:last-child{border:0;color:var(--mu)}
#menu b{display:block;padding:12px 20px}
#menu .ai{width:calc(100% - 40px);margin:6px 20px;padding:12px;border-radius:12px;background:var(--cd2);border:0}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0b10">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<main id="main"></main>

<div id="mini">
  <div class="ic">♪</div>
  <div class="tx"><b id="mt"></b><small id="ma"></small></div>
  <button class="h" id="mp">▶</button>
  <i id="mb"></i>
  <input type="range" id="ms" min="0" max="1000" value="0">
</div>

<nav>
  <button data-t="lib"><i>♪</i>Library</button>
  <button data-t="vid"><i>🎬</i>Videos</button>
  <button data-t="fav"><i>♥</i>Favorites</button>
  <button id="add" aria-label="Add songs or videos">+</button>
  <button data-t="pl"><i>☰</i>Playlists</button>
  <button data-t="snd"><i>🎚</i>Sound</button>
</nav>

<section id="np">
  <div class="top">
    <button id="cl" aria-label="Close">⌄</button>
    <span>Now playing</span>
    <button id="fs" aria-label="Fullscreen">⛶</button>
  </div>
  <div class="stage"><div id="art"></div></div>
  <h3 id="nt"></h3>
  <p id="na"></p>
  <div id="lyp"></div><div id="lyh"><button data-l="e">✎ Edit</button><button data-l="i">📄 Import</button><button data-l="m">⏱ Later</button><button data-l="p">⏱ Earlier</button><button data-l="x">Hide</button></div>
  <input type="range" id="sk" min="0" max="1000" value="0">
  <div class="tm"><span id="t1">0:00</span><span id="t2">0:00</span></div>
  <div class="ct">
    <button id="sh">🔀</button>
    <button id="pv">⏮</button>
    <button class="big" id="pp">▶</button>
    <button id="nx">⏭</button>
    <button id="rp">🔁</button>
  </div>
  <div class="ch">
    <button id="swq"></button>
    <button id="spd">1×</button>
    <button id="b10">⟲ 10s</button>
    <button id="f10">10s ⟳</button>
    <button id="ly">📝 Lyrics</button>
    <button id="qb">☰ Queue</button>
    <button id="pip">⧉ Pop-out</button>
  </div>
</section>

<div id="vw"><video id="v" playsinline webkit-playsinline x-webkit-airplay="allow"></video></div>
<button id="fv" aria-label="Favorite">♡</button>
<div id="sb">
  <button data-s="all">☑ All</button>
  <button data-s="pl">＋ List</button>
  <button data-s="fav">♥ Fav</button>
  <button data-s="del">🗑 Delete</button>
  <button data-s="x">✕</button>
</div>
<div id="menu"></div>
<div id="toast"></div>
<input type="file" id="fi" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" accept="audio/*,video/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.wma,.mp4,.mkv,.webm,.mov,.m4v" multiple>
<input type="file" id="fd" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" webkitdirectory multiple>
<input type="file" id="fl" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" accept=".lrc,.txt,text/plain"><input type="file" id="fj" style="position:fixed;left:-9999px;width:1px;height:1px;opacity:0" accept="application/json,.json">
<script>

const $=s=>document.querySelector(s),M=$('#main'),vd=$('#v'),np=$('#np'),vw=$('#vw'),mini=$('#mini'),
TH=[['Sunset','#ff7a45','#d6249f'],['Ocean','#22d3ee','#3b82f6'],['Neon','#a3e635','#06b6d4'],['Forest','#34d399','#15803d'],['Royal','#8b5cf6','#2563eb'],['Gold','#fbbf24','#f97316']],
EQN=['Bass','Low mid','Mid','High mid','Treble'],
PR={Flat:[0,0,0,0,0],'Bass boost':[7,4,0,0,0],Vocal:[-2,0,4,3,0],Pop:[-1,3,4,2,-1],Rock:[5,2,-1,3,5],'Hip-Hop':[6,3,0,1,3],'R&B':[5,3,1,0,2],Electronic:[6,2,0,3,5],Jazz:[3,2,-2,2,4],Classical:[4,2,-1,2,3],Metal:[5,0,-2,4,5],Acoustic:[3,1,2,3,3],Latin:[4,2,0,3,3],Reggae:[6,3,-1,1,2]};
let S={songs:[],pls:[],swap:true,theme:0,mode:'auto',eq:[0,0,0,0,0],preset:'Flat',shuf:0,rep:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('sp')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sp',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=id=>S.songs.find(s=>s.id==id),pl=id=>S.pls.find(p=>p.id==id);
let V='lib',OP=null,q='',VL=[],list=[],cur=-1,url=null,vid=false,ctx,pre,sp,mg,fl,slt,slm=0,sleepEnd=0,wake=null,nextUrl=null,nextId=null,artU=null,lt,lpd=0,sm=0,SEL=new Set(),FX=innerWidth-212,FY=innerHeight-300,opening=0,nxI=-1,tm,LR=null,li=-1;
/* storage for the actual files */
const db=new Promise(r=>{try{const o=indexedDB.open('sp',1);o.onupgradeneeded=()=>o.result.createObjectStore('f');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
const idb=async(m,k,val)=>{const d=await db;if(!d)return;return new Promise(r=>{const st=d.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f');const o=m=='get'?st.get(k):m=='put'?st.put(val,k):st.delete(k);o.onsuccess=()=>r(o.result);o.onerror=()=>r()})};
async function updStorage(){const el=$('#stot');if(!el)return;try{let n=0,bytes=0;for(const s of S.songs){const b=await idb('get',s.id);if(b){n++;bytes+=(b.size||b.byteLength||0)}const a=await idb('get','a'+s.id);if(a)bytes+=(a.size||a.byteLength||0)}const mb=(bytes/1048576).toFixed(1);el.textContent=n+' tracks · ~'+mb+' MB stored in app'+(navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate().then(e=>' · device quota '+((e.usage||0)/1048576).toFixed(0)+' / '+((e.quota||0)/1048576).toFixed(0)+' MB').catch(()=>''):'')}catch(e){el.textContent=S.songs.length+' tracks'}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),2200);try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}}
function menu(items){const m=$('#menu');m.innerHTML='<div>'+items.map((x,i)=>`<button data-i="${i}">${x[0]}</button>`).join('')+'<button data-i="-1">Cancel</button></div>';m.classList.add('on');m.onclick=e=>{const i=e.target.dataset.i;if(i===undefined&&e.target!==m)return;m.classList.remove('on');if(i>=0)items[i][1]()}}
function ask(t,vals,cb,area){const m=$('#menu');m.innerHTML=`<div><b style="display:block;padding:12px 15px">${t}</b>${vals.map(v=>area?`<textarea class="ai" rows="8" style="width:calc(100% - 40px);margin:6px 20px;padding:12px;border-radius:12px;background:var(--cd2);border:0;resize:vertical;font:inherit;color:inherit">${esc(v)}</textarea>`:`<input class="ai" value="${esc(v)}">`).join('')}<button data-i="1">Save</button><button data-i="-1">Cancel</button></div>`;m.classList.add('on');m.onclick=e=>{const i=e.target.dataset.i;if(i===undefined&&e.target!==m)return;if(i==1)cb([...m.querySelectorAll('.ai')].map(x=>x.value.trim()));m.classList.remove('on')}}

/* wake lock + next-track preload */
async function setWake(on){try{if(on&&!wake&&'wakeLock'in navigator){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null})}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}
async function preloadNext(){nxI=-1;if(nextUrl){try{URL.revokeObjectURL(nextUrl)}catch(e){}nextUrl=null;nextId=null}if(!list.length||cur<0||S.rep==2)return;let n;if(S.shuf){if(list.length<2)return;do{n=Math.floor(Math.random()*list.length)}while(n===cur&&list.length>1)}else{n=cur+1;if(n>=list.length){if(S.rep==1)n=0;else return}}nxI=n;const id=list[n];if(id===list[cur])return;const b=await idb('get',id);if(!b)return;nextId=id;nextUrl=URL.createObjectURL(b)}
/* theme */
function theme(){const r=document.documentElement,t=TH[S.theme];r.style.setProperty('--a',t[1]);r.style.setProperty('--b',t[2]);S.mode=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=S.mode}
/* audio graph: swap + EQ */
function initAudio(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();const src=ctx.createMediaElementSource(vd);pre=ctx.createGain();pre.channelCount=2;pre.channelCountMode='explicit';pre.channelInterpretation='speakers';sp=ctx.createChannelSplitter(2);mg=ctx.createChannelMerger(2);
fl=[60,230,910,3600,12000].map((f,i)=>{const b=ctx.createBiquadFilter();b.type=i==0?'lowshelf':i==4?'highshelf':'peaking';b.frequency.value=f;b.Q.value=1;return b});
src.connect(pre);pre.connect(sp);fl.reduce((a,b)=>(a.connect(b),b),mg).connect(ctx.destination);wire();applyEq();ctx.onstatechange=()=>{if(ctx.state!="running"&&!vd.paused)ctx.resume().catch(()=>{})}}
function wire(){sp.disconnect();const[a,b]=S.swap?[1,0]:[0,1];sp.connect(mg,0,a);sp.connect(mg,1,b)}
function applyEq(){if(fl)fl.forEach((f,i)=>f.gain.value=S.eq[i])}
function swl(){$('#swq').textContent='⇄ Swap left/right: '+(S.swap?'On':'Off')}
